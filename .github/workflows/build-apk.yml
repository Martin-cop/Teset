name: Build APK

on:
  push:
    branches: ['claude/**']
    paths: ['AppRecord-35/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppRecord-35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: AppRecord-35
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AppRecord-35-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppRecord-35-apk
          path: AppRecord-35/AppRecord-35-debug.apk
