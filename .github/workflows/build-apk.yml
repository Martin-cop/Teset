name: Build APK

on:
  push:
    branches: ['claude/**']
    paths: ['AppRecord-35/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: AppRecord-35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          build-root-directory: AppRecord-35
      - name: Build debug APK
        run: ./gradlew --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AppRecord-35-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: AppRecord-35-apk
          path: AppRecord-35/AppRecord-35-debug.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: AppRecord-35 build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: AppRecord-35/AppRecord-35-debug.apk
          prerelease: true
